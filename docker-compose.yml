services:
  dotgpt.server:
    image: ${DOCKER_REGISTRY-}dotgptserver
    build:
      context: .
      dockerfile: src/Server/Dockerfile
    networks:
      - dotgpt-network
    expose:
      - "8080"    # Expose port 8080 internally for other containers
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    
  dotgpt.client:
    image: ${DOCKER_REGISTRY-}dotgptclient
    build:
      context: .
      dockerfile: ./src/Client/Dockerfile
    ports:
      - "8081:80"    # Only expose the client app to the host
    networks:
      - dotgpt-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker

  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}
    environment:
      - "OLLAMA_DEBUG=1"
    # Removed external port mapping - only accessible within the Docker network
    networks:
      - dotgpt-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  dotgpt-network:
    driver: bridge

volumes:
  ollama:
    external: true
